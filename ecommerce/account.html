<!DOCTYPE html>
<html lang="en">
<head>
  <title>Account INRL</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="css/vendor.css">
  <link rel="stylesheet" type="text/css" href="css/global.css">
  <script src="/assets/js/auth-worker.js?v=20260205"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="site-header" data-page="account"></div>

  <section class="py-5" style="margin-top:76px">
    <div class="container" style="max-width:600px">
      <h1 class="text-uppercase mb-4">Account</h1>
      <div id="status" class="mb-3" style="font-size:14px">Checking authentication</div>
      <div id="signedIn" style="display:none">
        <div style="border:3px solid #333;padding:24px;box-shadow:4px 4px 0 rgba(0,237,10,.15);margin-bottom:24px;background:#212121">
          <p class="mb-2" style="font-size:14px"><span style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.5">Email</span><br><strong id="userEmail" style="font-family:'Roboto Mono',monospace"></strong></p>
          <p class="mb-3" style="font-size:14px"><span style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.5">Role</span><br><strong id="userRole" style="font-family:'Roboto Mono',monospace;color:#00ED0A"></strong></p>
          <button id="logoutBtn" class="btn btn-outline-dark text-uppercase" style="font-family:'Roboto Mono',monospace;font-size:12px;letter-spacing:.08em">Logout</button>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  <script src="js/cart.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>
  <script>
  // Login/logout/dashboard nav links are handled by include.js once the shared
  // header is injected; this listener just handles this page's own account panel.
  document.addEventListener('auth:ready', function(e){
    var statusEl=document.getElementById('status');var signedIn=document.getElementById('signedIn');var signedOut=document.getElementById('signedOut');
    var emailEl=document.getElementById('userEmail');var roleEl=document.getElementById('userRole');var logoutBtn=document.getElementById('logoutBtn');
    var user=e.detail&&e.detail.user;
    if(!user){
      var next=encodeURIComponent(location.pathname+location.search);
      location.href='login.html?next='+next;
      return;
    }
    statusEl.textContent='';signedIn.style.display='';
    emailEl.textContent=user.email;roleEl.textContent=user.role||'user';
    logoutBtn.addEventListener('click',async function(){await auth.logout();location.reload()});
  });
  </script>
</body>
</html>
