<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | INRL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="css/vendor.css">
  <link rel="stylesheet" type="text/css" href="css/global.css">
  <script src="/assets/js/auth-worker.js?v=20260205"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    .auth-input{background:var(--surface-0);border:1px solid var(--line-200);color:var(--ink-900);border-radius:10px !important;padding:12px 14px;font-family:var(--font-body);font-size:14px}
    .auth-input:focus{border-color:var(--accent-500);box-shadow:0 0 0 3px rgba(18,162,184,.12)}
    .auth-eye{position:absolute;top:50%;right:12px;transform:translateY(-50%);background:none;border:none;color:var(--ink-500);cursor:pointer;padding:0;line-height:1}
  </style>
</head>
<body>

  <div id="site-header" data-page="signup"></div>

  <!-- SIGNUP -->
  <section style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:120px 16px 60px;background:var(--surface-50)">
    <div style="width:100%;max-width:420px">

      <div class="text-center mb-4">
        <a href="index.html"><img src="images/main-logo.png" alt="INRL" style="height:32px" data-site-logo></a>
      </div>

      <div style="border:1px solid var(--line-200);border-radius:16px;padding:40px 36px;background:var(--surface-0)">
        <h1 class="mb-1" style="font-family:var(--font-display);font-size:26px;color:var(--ink-900);letter-spacing:-0.02em;text-transform:uppercase">Create account</h1>
        <p style="font-size:13px;color:var(--ink-500);margin-bottom:28px">Join INRL. Shop the drop, register your pieces.</p>

        <div id="status" style="font-size:13px;margin-bottom:16px;display:none"></div>

        <form id="signupForm" novalidate>
          <div class="mb-3">
            <label for="emailInput" class="form-label">Email</label>
            <input type="email" id="emailInput" class="form-control auth-input" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label for="passwordInput" class="form-label">Password</label>
            <div style="position:relative">
              <input type="password" id="passwordInput" class="form-control auth-input" autocomplete="new-password" required minlength="8" style="padding-right:44px">
              <button type="button" id="togglePw" class="auth-eye" aria-label="Show password">
                <svg id="pwEyeShow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="pwEyeHide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <div style="font-size:11px;color:var(--ink-500);margin-top:4px">Minimum 8 characters</div>
          </div>
          <div class="mb-4">
            <label for="confirmInput" class="form-label">Confirm password</label>
            <input type="password" id="confirmInput" class="form-control auth-input" autocomplete="new-password" required>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary w-100">Create account</button>
        </form>

        <div class="text-center mt-4" style="font-size:13px;color:var(--ink-500)">
          Already have an account?
          <a href="login.html" style="color:var(--accent-700);font-weight:500">Sign in</a>
        </div>
      </div>

    </div>
  </section>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="js/cart.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>
  <script>
    (function () {
      const qs = new URLSearchParams(location.search);
      const nextParam = qs.get('next');

      const statusEl = document.getElementById('status');
      function showStatus(msg, type) {
        statusEl.textContent = msg;
        statusEl.style.display = msg ? '' : 'none';
        statusEl.style.color = type === 'error' ? 'var(--danger-500)' : 'var(--accent-700)';
      }

      // Redirect if already signed in
      auth.me().then(user => {
        if (user) location.href = nextParam || 'index.html';
      });

      // Password visibility toggle
      const pwInput = document.getElementById('passwordInput');
      const eyeShow = document.getElementById('pwEyeShow');
      const eyeHide = document.getElementById('pwEyeHide');
      document.getElementById('togglePw').addEventListener('click', () => {
        const isHidden = pwInput.type === 'password';
        pwInput.type = isHidden ? 'text' : 'password';
        eyeShow.style.display = isHidden ? 'none' : '';
        eyeHide.style.display = isHidden ? '' : 'none';
      });

      // Form submit
      const form = document.getElementById('signupForm');
      const submitBtn = document.getElementById('submitBtn');
      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;
        const confirm = document.getElementById('confirmInput').value;

        if (!email || !password) {
          showStatus('Email and password are required.', 'error');
          return;
        }
        if (password.length < 8) {
          showStatus('Password must be at least 8 characters.', 'error');
          return;
        }
        if (password !== confirm) {
          showStatus('Passwords do not match.', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account…';
        showStatus('', '');

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ email, password })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data?.error || `Registration failed (${res.status})`);

          showStatus('Account created! Redirecting…', 'success');
          setTimeout(() => { location.href = nextParam || 'index.html'; }, 800);
        } catch (e) {
          showStatus(e?.message || 'Registration failed. Please try again.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create account';
        }
      });
    })();
  </script>
</body>
</html>
