<!DOCTYPE html>
<html lang="en">
<head>
  <title>Saved for later | INRL</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="/assets/js/auth-worker.js?v=20260205"></script>
  <style>
    .wl-head{padding-block:48px 40px;border-bottom:1px solid var(--line-100);margin-bottom:40px}
    @media (min-width:1024px){.wl-head{padding-block:136px 64px;margin-bottom:80px}}
    .wl-head .t-page{margin:14px 0 28px}
    .wl-actions{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:14px}
    .wl-actions button{background:none;border:0;padding:0;cursor:pointer;font:inherit}
    .wl-add{color:var(--accent-700);font-weight:500}
    .wl-add:hover,.wl-rm:hover{text-decoration:underline}
    .wl-rm{color:var(--ink-500)}
    .wl-sold{color:var(--ink-700);font-weight:500}
    @media (max-width:767.98px){
      .wl-grid{grid-template-columns:1fr!important;gap:0!important}
      .wl-item{display:grid;grid-template-columns:72px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line-100)}
      .wl-item .pcard__img{aspect-ratio:auto;height:88px;margin:0;font-size:8px}
      .wl-item .wl-actions{flex-direction:column;align-items:flex-end;justify-content:space-between;margin:0}
    }
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;z-index:1080;background:var(--dark-800);color:var(--paper-100);border-radius:999px;padding:12px 20px;font-size:14px;transition:opacity var(--t-element),transform var(--t-element);pointer-events:none}
    .toast.is-on{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body class="site">
  <div id="site-header" data-page="account"></div>

  <main id="main" style="padding-bottom:128px">
    <div class="wrap" id="full" hidden>
      <div class="wl-head">
        <p class="t-label t-label--teal">Saved</p>
        <h1 class="t-page">Saved for later.</h1>
        <p class="t-lead" id="count" style="color:var(--ink-500);margin:0"></p>
      </div>
      <div class="pgrid wl-grid" id="grid"></div>
    </div>

    <div class="wrap wrap--focus" id="empty" hidden>
      <div class="empty">
        <p class="t-label">Saved</p>
        <h1 class="t-task">Nothing saved yet.</h1>
        <p class="t-lead">Saving a piece keeps it here while you decide. It does not hold stock &mdash; a drop can close with something still on your list.</p>
        <a class="b" href="shop.html">See the drop</a>
      </div>
      <p class="t-label" style="margin:0 0 16px">In the drop now</p>
      <div class="pgrid" id="dropNow"></div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="site-footer"></div>

  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>
  <script>
  (function () {
    var esc = INRL.esc;
    var CATALOG = [];
    var WORDS = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'];
    function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('is-on'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('is-on'); }, 2200); }
    function productFor(item) { return CATALOG.find(function (p) { return p.slug && p.slug === (item.slug || item.id); }) || null; }

    function render() {
      var items = Wishlist.list();
      document.getElementById('full').hidden = !items.length;
      document.getElementById('empty').hidden = !!items.length;
      if (!items.length) {
        var g = document.getElementById('dropNow');
        if (!g.dataset.done) { g.dataset.done = '1'; g.innerHTML = INRL.skeletonCards(4); INRL.fetchProducts().then(function (l) { g.innerHTML = l.slice(0, 4).map(INRL.productCardRow).join(''); }).catch(function () { g.innerHTML = ''; }); }
        return;
      }
      var n = items.length;
      document.getElementById('count').textContent = (n < WORDS.length ? WORDS[n] : n) + ' piece' + (n === 1 ? '' : 's') + ' held. Nothing is reserved — a drop can sell out while it sits here.';
      document.getElementById('grid').innerHTML = items.map(function (it) {
        var p = productFor(it) || { title: it.title || it.name, slug: it.slug, price_cents: Math.round((it.price || 0) * 100), image_url: it.image, ar_target_id: it.ar ? 1 : null };
        var sold = INRL.isSoldOut(p);
        var href = INRL.productHref(p);
        var img = INRL.imageUrl(p.image_url || it.image);
        return '<div class="wl-item' + (sold ? ' pcard is-soldout' : ' pcard') + '">'
          + '<a class="ph pcard__img" href="' + esc(href) + '">' + (img ? '<img src="' + esc(img) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '<span>Primary image</span></a>'
          + '<div><a href="' + esc(href) + '" style="color:inherit;text-decoration:none"><p class="pcard__title">' + esc(p.title || it.name || 'Piece') + '</p></a>'
          + '<div class="pcard__price tnum">' + (sold ? 'Sold out' : '<span class="from">From</span>' + INRL.moneyFromCents(p.price_cents, p.currency)) + '</div>' + INRL.layerTag(p) + '</div>'
          + '<div class="wl-actions">' + (sold ? '<span class="wl-sold">Sold out</span>' : '<button type="button" class="wl-add" data-add="' + esc(it.id) + '">Add to bag</button>')
          + '<button type="button" class="wl-rm" data-rm="' + esc(it.id) + '">Remove</button></div>'
          + '</div>';
      }).join('');
    }

    document.addEventListener('click', function (e) {
      var rm = e.target.closest('[data-rm]');
      if (rm) { Wishlist.remove(rm.getAttribute('data-rm')); render(); toast('Removed from your saved pieces'); return; }
      var add = e.target.closest('[data-add]');
      if (!add) return;
      var it = Wishlist.list().find(function (x) { return x.id === add.getAttribute('data-add'); });
      if (!it) return;
      var p = productFor(it);
      var sizes = p ? INRL.parseSizes(p) : [];
      if (sizes.length > 1) { location.href = INRL.productHref(p) ; return; } // the size is chosen on the piece's page
      var size = sizes[0] || null;
      var map = p ? INRL.parseVariantMap(p) : {};
      var variant = (size && map[size]) || (p && p.printful_sync_variant_id) || null;
      Cart.add({ id: 'sku-' + (it.slug || it.id) + (size ? '-' + size : ''), slug: it.slug || (p && p.slug) || '', size: size, name: (p && p.title || it.name || 'Piece').replace(/^No\.\s*\d+\s+/, ''), price: p ? Number(p.price_cents || 0) / 100 : Number(it.price || 0), image: it.image || '', qty: 1, ar: !!(p ? p.ar_target_id : it.ar), variantId: variant, printful_sync_variant_id: variant });
      CartUI.render();
      toast('Added to your bag');
    });

    render();
    INRL.fetchProducts().then(function (l) { CATALOG = l; render(); }).catch(function () {});
  })();
  </script>
</body>
</html>
