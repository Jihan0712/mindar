<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wishlist | INRL</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Your INRL wishlist — save favourites and shop when ready.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="css/vendor.css">
  <link rel="stylesheet" type="text/css" href="css/global.css">
  <script src="/assets/js/auth-worker.js?v=20260206"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

  <div id="site-header" data-page="wishlist"></div>

  <!-- PAGE HERO -->
  <section style="background:var(--surface-0);padding:140px 0 40px">
    <div class="container">
      <div class="section-eyebrow" style="color:var(--ink-500);margin-bottom:14px">Saved pieces</div>
      <h1 style="font-family:var(--font-display);font-size:clamp(36px,5.5vw,68px);line-height:.95;letter-spacing:-0.03em;color:var(--ink-900);text-transform:uppercase">Your wishlist</h1>
    </div>
  </section>

  <!-- WISHLIST CONTENT -->
  <section style="background:var(--surface-0);padding:24px 0 100px">
    <div class="container">
      <div id="wishlistEmpty" style="text-align:center;padding:100px 0;display:none">
        <div style="font-size:64px;line-height:1;color:var(--line-200);margin-bottom:20px">&#9825;</div>
        <p class="eyebrow" style="margin-bottom:28px">Your wishlist is empty</p>
        <a href="shop.html" class="btn btn-primary btn-lg">Browse the collection</a>
      </div>
      <div id="wishlistItems" style="border:1px solid var(--line-200);border-radius:12px;overflow:hidden;display:none"></div>
      <div id="wishlistActions" style="margin-top:24px;display:none;gap:12px;flex-wrap:wrap">
        <a href="shop.html" class="btn btn-outline-dark">Continue shopping</a>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/jquery.min.js"></script>
  <script src="js/plugins.js"></script>
  <script src="js/SmoothScroll.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  <script src="js/script.min.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>
  <script>
    function escHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderWishlist() {
      var items = Wishlist.list();
      var emptyEl = document.getElementById('wishlistEmpty');
      var tableEl = document.getElementById('wishlistItems');
      var actionsEl = document.getElementById('wishlistActions');
      if (!items.length) {
        emptyEl.style.display = 'block';
        tableEl.style.display = 'none';
        actionsEl.style.display = 'none';
        return;
      }
      emptyEl.style.display = 'none';
      tableEl.style.display = 'block';
      actionsEl.style.display = 'flex';
      tableEl.innerHTML = items.map(function(item, i) {
        var topBorder = i > 0 ? 'border-top:1px solid var(--line-200);' : '';
        return '<div class="d-flex align-items-center gap-3 p-3" style="' + topBorder + '">'
          + '<a href="product.html?product=' + escHtml(item.slug || item.id) + '" style="flex-shrink:0;display:block;overflow:hidden;border-radius:8px">'
          + '<img src="' + escHtml(item.image || '') + '" alt="' + escHtml(item.name) + '" style="width:72px;height:72px;object-fit:cover;display:block">'
          + '</a>'
          + '<div class="flex-grow-1" style="min-width:0">'
          + '<a href="product.html?product=' + escHtml(item.slug || item.id) + '" style="font-family:var(--font-body);font-size:14px;color:var(--ink-900);text-decoration:none;display:block;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escHtml(item.name) + '</a>'
          + '<div style="font-size:13px;color:var(--ink-500)">$' + (+(item.price) || 0).toFixed(2) + '</div>'
          + '</div>'
          + '<div class="d-flex gap-2 align-items-center flex-shrink-0">'
          + '<button data-wish-to-cart="' + escHtml(item.id) + '" class="btn btn-sm btn-primary" style="font-size:.72rem">Add to bag</button>'
          + '<button data-wish-remove="' + escHtml(item.id) + '" style="width:32px;height:32px;border-radius:999px;background:transparent;border:1px solid var(--line-200);color:var(--ink-500);font-size:13px;line-height:1;cursor:pointer" title="Remove from wishlist">&#x2715;</button>'
          + '</div>'
          + '</div>';
      }).join('');
      try { CartUI.render(); } catch(err) {}
    }

    document.addEventListener('click', function(e) {
      var removeBtn = e.target.closest('[data-wish-remove]');
      if (removeBtn) {
        Wishlist.remove(removeBtn.dataset.wishRemove);
        renderWishlist();
        return;
      }
      var cartBtn = e.target.closest('[data-wish-to-cart]');
      if (cartBtn) {
        var id = cartBtn.dataset.wishToCart;
        var items = Wishlist.list();
        var item = null;
        for (var i = 0; i < items.length; i++) { if (items[i].id === id) { item = items[i]; break; } }
        if (item) {
          Cart.add({ id: item.id, slug: item.slug || '', name: item.name, price: item.price, image: item.image, qty: 1 });
          Wishlist.remove(id);
          renderWishlist();
        }
      }
    });

    renderWishlist();
  </script>
</body>
</html>
