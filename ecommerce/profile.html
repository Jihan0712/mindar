<!DOCTYPE html>
<html lang="en">
<head>
  <title>Profile INRL</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="css/vendor.css">
  <link rel="stylesheet" type="text/css" href="css/global.css">
  <script src="/assets/js/auth-worker.js?v=20260205"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="preloader text-white fs-6 text-uppercase overflow-hidden"></div>

  <div id="site-header" data-page="profile"></div>

  <section class="py-5" style="margin-top:76px">
    <div class="container" style="max-width:720px">
      <h1 class="text-uppercase mb-4">Profile</h1>
      <div id="status" class="mb-3" style="font-size:14px">Checking authentication</div>
      <div id="signedIn" style="display:none">
        <div style="border:3px solid #1C1C1C;padding:24px;box-shadow:4px 4px 0 #1C1C1C;margin-bottom:24px">
          <h4 class="text-uppercase mb-3">Account Info</h4>
          <p><strong>Email:</strong> <span id="userEmail"></span></p>
          <p><strong>Role:</strong> <span id="userRole"></span></p>
          <a id="arDashboardBtn" href="dashboard.html" class="btn btn-primary text-uppercase me-2" style="display:none">Dashboard</a>
          <button id="logoutBtn" class="btn btn-outline-dark text-uppercase">Logout</button>
        </div>
        <div style="border:3px solid #1C1C1C;padding:24px;box-shadow:4px 4px 0 #1C1C1C">
          <h4 class="text-uppercase mb-3">Change Password</h4>
          <div id="pwStatus" class="mb-2" style="font-size:14px"></div>
          <form id="pwForm">
            <div class="mb-3"><label class="form-label">Current Password</label><input type="password" class="form-control" id="currentPassword" required></div>
            <div class="mb-3"><label class="form-label">New Password</label><input type="password" class="form-control" id="newPassword" required minlength="8"></div>
            <div class="mb-3"><label class="form-label">Confirm New Password</label><input type="password" class="form-control" id="confirmPassword" required></div>
            <button type="submit" id="submitBtn" class="btn btn-primary text-uppercase">Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/jquery.min.js"></script>
  <script src="js/plugins.js"></script>
  <script src="js/SmoothScroll.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  <script src="js/script.min.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>
  <script>
  // Login/logout/dashboard nav links are handled by include.js once the shared
  // header is injected; this listener just handles the page's own account panel.
  document.addEventListener('auth:ready', function(e){
    var statusEl=document.getElementById('status');var signedIn=document.getElementById('signedIn');
    var emailEl=document.getElementById('userEmail');var roleEl=document.getElementById('userRole');
    var dashBtn=document.getElementById('arDashboardBtn');var logoutBtn=document.getElementById('logoutBtn');
    var user=e.detail&&e.detail.user;
    if(!user){statusEl.textContent='Not signed in. Redirecting';setTimeout(function(){location.href='login.html'},1500);return}
    statusEl.textContent='';signedIn.style.display='';
    emailEl.textContent=user.email;roleEl.textContent=user.role||'user';
    var canDash=user.role==='admin'||user.role==='brand';
    if(dashBtn)dashBtn.style.display=canDash?'':'none';
    logoutBtn.addEventListener('click',async function(){await auth.logout();location.href='login.html'});
  });

  document.getElementById('pwForm').addEventListener('submit',async function(e){
    e.preventDefault();var s=document.getElementById('pwStatus');var btn=document.getElementById('submitBtn');
    var cur=document.getElementById('currentPassword').value;var np=document.getElementById('newPassword').value;var cp=document.getElementById('confirmPassword').value;
    if(np!==cp){s.textContent='Passwords do not match.';s.style.color='red';return}
    if(np.length<8){s.textContent='Password must be at least 8 characters.';s.style.color='red';return}
    try{
      btn.disabled=true;s.textContent='Updating';s.style.color='';
      var res=await fetch('/api/auth/change-password',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:cur,newPassword:np})});
      var data=await res.json().catch(function(){return{}});
      if(!res.ok)throw new Error(data.error||'Failed');
      s.textContent='Password updated successfully!';s.style.color='#00ED0A';e.target.reset();
    }catch(err){s.textContent='Error: '+err.message;s.style.color='red'}finally{btn.disabled=false}
  });
  </script>
</body>
</html>
