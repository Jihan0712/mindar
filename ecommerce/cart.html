<!DOCTYPE html>
<html lang="en">
<head>
  <title>Cart INRL</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="css/vendor.css">
  <link rel="stylesheet" type="text/css" href="css/global.css">
  <script src="/assets/js/auth-worker.js?v=20260205"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="preloader text-white fs-6 text-uppercase overflow-hidden"></div>

  <div id="site-header" data-page="cart"></div>

  <section class="py-5" style="margin-top:76px">
    <div class="container">
      <h1 class="text-uppercase mb-2">Your Cart <span class="badge bg-primary" id="cart-count">0</span></h1>
      <ul id="cart-list" class="list-group mb-4"></ul>
      <div class="d-flex justify-content-between align-items-center p-3 mb-4" style="border:3px solid #1C1C1C;background:#FEFD00;box-shadow:4px 4px 0 #1C1C1C">
        <strong class="text-uppercase">Total</strong>
        <strong class="fs-4" id="cart-total">$0.00</strong>
      </div>
      <div class="d-flex gap-3 flex-wrap">
        <a href="checkout.html" class="btn btn-primary btn-lg text-uppercase">Proceed to Checkout</a>
        <button id="clearCart" class="btn btn-outline-dark btn-lg text-uppercase">Clear Cart</button>
        <a href="shop.html" class="btn btn-outline-dark btn-lg text-uppercase">Continue Shopping</a>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/jquery.min.js"></script>
  <script src="js/plugins.js"></script>
  <script src="js/SmoothScroll.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  <script src="js/script.min.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>
  <script>
  CartUI.render();
  document.getElementById('clearCart').addEventListener('click',function(){Cart.clear();CartUI.render()});
  </script>
</body>
</html>
