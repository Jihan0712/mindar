<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bag | INRL</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="css/vendor.css">
  <link rel="stylesheet" type="text/css" href="css/global.css">
  <script src="/assets/js/auth-worker.js?v=20260205"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <div class="preloader text-white fs-6 text-uppercase overflow-hidden"></div>

  <div id="site-header" data-page="cart"></div>

  <section style="padding:132px 0 100px">
    <div class="container" style="max-width:760px">
      <h1 class="mb-4" style="font-family:var(--font-display);text-transform:uppercase;letter-spacing:-0.02em;color:var(--ink-900);font-size:clamp(28px,4vw,40px)">Your bag <span class="badge bg-primary" id="cart-count">0</span></h1>
      <ul id="cart-list" class="list-group mb-4"></ul>
      <div class="d-flex justify-content-between align-items-center p-4 mb-4" style="background:var(--surface-50);border-radius:12px">
        <strong>Total</strong>
        <strong class="fs-4" id="cart-total" style="font-family:var(--font-display)">$0.00</strong>
      </div>
      <div class="d-flex gap-3 flex-wrap">
        <a href="checkout.html" class="btn btn-primary btn-lg">Continue to checkout</a>
        <button id="clearCart" class="btn btn-outline-dark btn-lg">Clear bag</button>
        <a href="shop.html" class="btn btn-link" style="color:var(--ink-700)">Continue shopping</a>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/jquery.min.js"></script>
  <script src="js/plugins.js"></script>
  <script src="js/SmoothScroll.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  <script src="js/script.min.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>
  <script>
  CartUI.render();
  document.getElementById('clearCart').addEventListener('click',function(){Cart.clear();CartUI.render()});
  </script>
</body>
</html>
