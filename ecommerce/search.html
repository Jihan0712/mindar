<!DOCTYPE html>
<html lang="en">
<head>
  <title>Search | INRL</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="/assets/js/auth-worker.js?v=20260205"></script>
  <style>
    .results-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:24px 0 32px}
    @media (min-width:1024px){.results-head{margin:28px 0 40px}}
    .sortpill{position:relative}
    .sortpill select{appearance:none;border:1px solid var(--surface-4);border-radius:999px;background:var(--surface-0);font:13px var(--font-body);color:var(--ink-900);padding:8px 14px;cursor:pointer}
    .sortpill select:hover{border-color:var(--ink-900)}
    .none .t-task{text-transform:uppercase}
    .none{padding-block:72px 48px}
    @media (min-width:1024px){.none{padding-block:96px 64px}}
  </style>
</head>
<body class="site">
  <div id="site-header" data-page="search"></div>

  <main id="main" class="page-top" style="padding-bottom:96px">
    <div class="wrap wrap--focus">
      <form class="bigsearch" role="search" id="searchForm">
        <label for="q" class="visually-hidden">Search pieces</label>
        <input type="search" id="q" name="q" placeholder="Search pieces" autocomplete="off" autofocus>
        <button type="button" id="clearBtn">Clear</button>
      </form>

      <div class="results-head" id="resultsHead" hidden>
        <span class="tnum" id="resultsCount" aria-live="polite" style="color:var(--ink-700)"></span>
        <label class="sortpill"><span class="visually-hidden">Sort</span>
          <select id="sort"><option value="new">Newest first</option><option value="price_asc">Price: low to high</option><option value="price_desc">Price: high to low</option></select>
        </label>
      </div>

      <div id="none" class="none" hidden>
        <h1 class="t-task" id="noneTitle"></h1>
        <p class="t-lead" style="max-width:560px;margin:24px 0 28px">We make a small number of pieces at a time. There is nothing like that in this drop &mdash; here is everything currently made.</p>
        <div class="b-row"><a class="b" href="shop.html">See the drop</a><a class="b b--ghost" href="contact.html?topic=request">Tell us what to make</a></div>
      </div>

      <p class="t-label" id="dropLabel" hidden style="margin:0 0 16px">In the drop now</p>
      <div class="pgrid" id="results" aria-live="polite"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>
  <script>
  (function () {
    var q = document.getElementById('q'), sort = document.getElementById('sort');
    var grid = document.getElementById('results');
    var ALL = null;
    function norm(s) { return String(s || '').trim().toLowerCase(); }
    function score(p, query) {
      var t = norm(p.title), c = norm(p.category), s = 0;
      query.split(/\s+/).filter(Boolean).forEach(function (w) {
        if (t.indexOf(w) !== -1) s += 3;
        if (c.indexOf(w) !== -1) s += 1;
        if (norm(p.color).indexOf(w) !== -1) s += 1;
      });
      return s;
    }
    function run() {
      var query = norm(q.value);
      var u = new URL(location.href);
      if (query) u.searchParams.set('q', q.value.trim()); else u.searchParams.delete('q');
      history.replaceState(null, '', u);
      document.title = (query ? '“' + q.value.trim() + '” — ' : '') + 'Search | INRL';
      if (!ALL) return;
      var none = document.getElementById('none'), head = document.getElementById('resultsHead'), label = document.getElementById('dropLabel');
      if (!query) {
        none.hidden = true; head.hidden = true; label.hidden = false;
        grid.innerHTML = ALL.slice(0, 8).map(INRL.productCardRow).join('');
        return;
      }
      var hits = ALL.map(function (p) { return { p: p, s: score(p, query) }; }).filter(function (x) { return x.s > 0; });
      if (!hits.length) {
        head.hidden = true; none.hidden = false; label.hidden = false;
        document.getElementById('noneTitle').textContent = 'Nothing for “' + q.value.trim() + '”.';
        grid.innerHTML = ALL.slice(0, 4).map(INRL.productCardRow).join('');
        return;
      }
      var list = hits.map(function (x) { return x.p; });
      if (sort.value === 'price_asc') list.sort(function (a, b) { return a.price_cents - b.price_cents; });
      else if (sort.value === 'price_desc') list.sort(function (a, b) { return b.price_cents - a.price_cents; });
      else list.sort(function (a, b) { return (Date.parse(b.created_at) || 0) - (Date.parse(a.created_at) || 0); });
      none.hidden = true; label.hidden = true; head.hidden = false;
      document.getElementById('resultsCount').textContent = list.length + ' piece' + (list.length === 1 ? '' : 's');
      grid.innerHTML = list.map(INRL.productCardRow).join('');
    }
    var t;
    q.addEventListener('input', function () { clearTimeout(t); t = setTimeout(run, 160); });
    sort.addEventListener('change', run);
    document.getElementById('searchForm').addEventListener('submit', function (e) { e.preventDefault(); run(); });
    document.getElementById('clearBtn').addEventListener('click', function () { q.value = ''; q.focus(); run(); });

    q.value = new URLSearchParams(location.search).get('q') || new URLSearchParams(location.search).get('s') || '';
    grid.innerHTML = INRL.skeletonCards(4);
    INRL.fetchProducts().then(function (items) { ALL = items; run(); }).catch(function () {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1;padding-top:24px"><h2 class="t-task">Something broke on our side.</h2><p class="t-lead">Search could not reach the shop.</p><button class="b" type="button" onclick="location.reload()">Try again</button></div>';
    });
  })();
  </script>
</body>
</html>
