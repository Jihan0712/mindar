<!DOCTYPE html>
<html lang="en">
<head>
  <title>Shop | INRL</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="css/vendor.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
  <link rel="stylesheet" type="text/css" href="css/global.css">
  <script src="/assets/js/auth-worker.js?v=20260205"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  .shop-card{overflow:hidden}
  .shop-card-image{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;overflow:hidden;background:var(--surface-50)}
  .shop-card-image img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
  .shop-card:hover .shop-card-image img{transform:scale(1.03)}
  .shop-card-body{padding:14px 0 0}
  .shop-card-title{font-family:var(--font-body);font-size:14px;font-weight:400;color:var(--ink-900);margin-bottom:2px}
  .shop-card-meta{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
  .shop-card-price{font-family:var(--font-body);font-size:14px;color:var(--ink-900)}
  .shop-cat-pill{border:1px solid var(--line-200);border-radius:999px;padding:.4rem 1.1rem;font-size:.8rem;color:var(--ink-700);background:var(--surface-0);cursor:pointer;transition:all .15s}
  .shop-cat-pill:hover{border-color:var(--ink-500)}
  .shop-cat-pill.active{background:var(--ink-900);color:var(--surface-0);border-color:var(--ink-900)}
</style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none"><defs>
    <symbol id="heart" viewBox="0 0 24 24"><path fill="currentColor" d="M20.16 4.61A6.27 6.27 0 0 0 12 4a6.27 6.27 0 0 0-8.16 9.48l7.45 7.45a1 1 0 0 0 1.42 0l7.45-7.45a6.27 6.27 0 0 0 0-8.87Zm-1.41 7.46L12 18.81l-6.75-6.74a4.28 4.28 0 0 1 3-7.3a4.25 4.25 0 0 1 3 1.25a1 1 0 0 0 1.42 0a4.27 4.27 0 0 1 6 6.05Z"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><path fill="currentColor" d="M21.71 20.29L18 16.61A9 9 0 1 0 16.61 18l3.68 3.68a1 1 0 0 0 1.42 0a1 1 0 0 0 0-1.39ZM11 18a7 7 0 1 1 7-7a7 7 0 0 1-7 7Z"/></symbol>
  </defs></svg>

  <div class="preloader text-white fs-6 text-uppercase overflow-hidden"></div>

  <div id="site-header" data-page="shop"></div>

  <!-- Page Header -->
  <div style="padding:132px 0 32px;background:var(--surface-0)">
    <div class="container">
      <h1 id="shopTitle" class="mb-2" style="color:var(--ink-900);text-transform:uppercase;font-size:clamp(36px,5vw,64px);letter-spacing:-0.03em">Shop</h1>
      <p id="liveCatalogUser" class="mb-0 eyebrow"></p>
    </div>
  </div>

  <!-- Shop Controls + Grid -->
  <section class="pb-5" style="background:var(--surface-0)">
    <div class="container">
      <div class="row mb-3 g-3 align-items-center">
        <div class="col-md-6">
          <div class="position-relative">
            <svg width="16" height="16" viewBox="0 0 24 24" style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-500)"><use xlink:href="#search"></use></svg>
            <input type="text" id="shopSearchInput" class="form-control" style="padding-left:42px" placeholder="Search pieces">
          </div>
        </div>
        <div class="col-md-3 offset-md-3">
          <select id="shopSortSelect" class="form-select">
            <option value="relevance">Newest first</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="popularity">Popularity</option>
          </select>
        </div>
      </div>
      <div class="d-flex flex-wrap gap-2 align-items-center mb-4">
        <button type="button" class="shop-cat-pill active" data-cat="">All</button>
        <button type="button" class="shop-cat-pill" data-cat="Men">Men</button>
        <button type="button" class="shop-cat-pill" data-cat="Women">Women</button>
        <button type="button" class="shop-cat-pill" data-cat="Accessories">Accessories</button>
        <span id="shopResultsLabel" class="eyebrow ms-auto"></span>
      </div>
      <div id="shopStatus" class="mb-3" style="font-size:14px;color:var(--ink-500)">Loading products</div>
      <div class="row" id="shopProductsGrid"></div>
    </div>
  </section>

  <!-- Footer -->
  <div id="site-footer"></div>

  <script src="js/jquery.min.js"></script>
  <script src="js/plugins.js"></script>
  <script src="js/SmoothScroll.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
  <script src="js/script.min.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>

  <!-- Size Picker Modal -->
  <div class="modal fade" id="shopSizePickerModal" tabindex="-1" aria-labelledby="shopSizePickerLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="shopSizePickerLabel">Select a size</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body py-4" id="shopSizePickerBody">
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('auth:ready',function(e){var userEl=document.getElementById('liveCatalogUser');if(!userEl)return;var user=e.detail&&e.detail.user;userEl.textContent=user?'Signed in as '+user.email+' ('+user.role+')':''});

    function moneyFromCents(cents,currency){var amt=(Number(cents||0)/100);var sym=(currency||'USD')==='USD'?'$':'';return sym+amt.toFixed(2)}
    function normalizeCatalogImageUrl(u){var s=(u||'').toString();if(!s)return s;if(s.startsWith('data:'))return s;if(s.startsWith('http://')||s.startsWith('https://'))return s;if(s.startsWith('/api/'))return s;if(s.startsWith('/ecommerce/'))return s;if(s.startsWith('/images/'))return s.replace(/^\/images\//,'images/');return s}
    function toNum(v,fallback){var n=Number(v);return Number.isFinite(n)?n:(fallback||0)}
    function normText(s){return String(s||'').trim().toLowerCase()}
    function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function createdAtKey(p){var t=Date.parse(p&&p.created_at?String(p.created_at):'');if(Number.isFinite(t))return t;var u=Date.parse(p&&p.updated_at?String(p.updated_at):'');if(Number.isFinite(u))return u;return toNum(p&&p.id,0)}

    function relevanceScore(p,q){
      var query=normText(q);if(!query)return 0;
      var title=normText(p&&p.title);var category=normText(p&&p.category);var brand=normText(p&&p.brand);
      var tokens=query.split(/\s+/).filter(Boolean);var score=0;
      function scoreField(field,w){if(!field)return;if(field===query)score+=w.exact;if(field.startsWith(query))score+=w.prefix;if(field.includes(query))score+=w.contains;for(var i=0;i<tokens.length;i++){var t=tokens[i];if(t.length<2)continue;if(field===t)score+=w.tokenExact;else if(field.startsWith(t))score+=w.tokenPrefix;else if(field.includes(t))score+=w.tokenContains}}
      scoreField(title,{exact:120,prefix:80,contains:50,tokenExact:40,tokenPrefix:25,tokenContains:12});
      scoreField(category,{exact:70,prefix:45,contains:25,tokenExact:18,tokenPrefix:12,tokenContains:6});
      scoreField(brand,{exact:60,prefix:35,contains:20,tokenExact:14,tokenPrefix:10,tokenContains:5});
      return score;
    }
    function matchesQuery(p,q){var query=normText(q);if(!query)return true;var title=normText(p&&p.title);var category=normText(p&&p.category);var brand=normText(p&&p.brand);return title.includes(query)||category.includes(query)||brand.includes(query)}
    function readShopStateFromUrl(){var url=new URL(location.href);var categoryRaw=(url.searchParams.get('category')||'').trim();var q=(url.searchParams.get('q')||'').trim();var sort=(url.searchParams.get('sort')||'relevance').trim();return{categoryRaw:categoryRaw,category:categoryRaw.toLowerCase(),q:q,sort:sort}}
    function updateShopUrlParams(next){var url=new URL(location.href);if('q' in next){var q=String(next.q||'').trim();if(q)url.searchParams.set('q',q);else url.searchParams.delete('q')}if('sort' in next){var s=String(next.sort||'').trim();if(s&&s!=='relevance')url.searchParams.set('sort',s);else url.searchParams.delete('sort')}if('category' in next){var c=String(next.category||'').trim();if(c)url.searchParams.set('category',c);else url.searchParams.delete('category')}history.replaceState(null,'',url.toString())}

    var SHOP_ALL_ITEMS=null;var SHOP_LOADING=null;
    async function ensureShopProducts(){if(Array.isArray(SHOP_ALL_ITEMS))return SHOP_ALL_ITEMS;if(SHOP_LOADING)return SHOP_LOADING;SHOP_LOADING=(async function(){var res=await fetch('/api/products',{credentials:'include'});if(!res.ok)throw new Error('Products API error ('+res.status+')');var data=await res.json();var items=Array.isArray(data&&data.items)?data.items:[];SHOP_ALL_ITEMS=items;SHOP_LOADING=null;return items})();return SHOP_LOADING}

    function sortItems(items,sort,q){var s=(sort||'relevance').toLowerCase();var query=String(q||'').trim();var list=items.slice();if(s==='price_asc'){list.sort(function(a,b){return toNum(a&&a.price_cents,0)-toNum(b&&b.price_cents,0)});return list}if(s==='price_desc'){list.sort(function(a,b){return toNum(b&&b.price_cents,0)-toNum(a&&a.price_cents,0)});return list}if(s==='popularity'){list.sort(function(a,b){return createdAtKey(b)-createdAtKey(a)});return list}if(!query)return list;list.sort(function(a,b){var sa=relevanceScore(a,query);var sb=relevanceScore(b,query);if(sb!==sa)return sb-sa;return createdAtKey(b)-createdAtKey(a)});return list}

    function setShopControlsFromUrl(){var state=readShopStateFromUrl();var searchEl=document.getElementById('shopSearchInput');var sortEl=document.getElementById('shopSortSelect');var popupSearchEl=document.getElementById('search-form');if(searchEl&&searchEl.value!==state.q)searchEl.value=state.q;if(popupSearchEl&&popupSearchEl.value!==state.q)popupSearchEl.value=state.q;var allowed=['relevance','price_asc','price_desc','popularity'];var nextSort=allowed.includes(String(state.sort||'').toLowerCase())?String(state.sort).toLowerCase():'relevance';if(sortEl)sortEl.value=nextSort;document.querySelectorAll('.shop-cat-pill').forEach(function(p){p.classList.toggle('active',(p.getAttribute('data-cat')||'').toLowerCase()===state.category)})}

    async function renderShopProducts(){
      var gridEl=document.getElementById('shopProductsGrid');var statusEl=document.getElementById('shopStatus');var labelEl=document.getElementById('shopResultsLabel');var titleEl=document.getElementById('shopTitle');
      if(!gridEl)return;var state=readShopStateFromUrl();
      if(titleEl)titleEl.textContent=state.categoryRaw?state.categoryRaw:'Shop';
      try{
        if(statusEl)statusEl.textContent='Loading products';var items=await ensureShopProducts();
        var categoryFiltered=state.category?items.filter(function(p){return(p&&p.category!=null?String(p.category):'').toLowerCase().includes(state.category)}):items;
        var searched=state.q?categoryFiltered.filter(function(p){return matchesQuery(p,state.q)}):categoryFiltered;
        var sorted=sortItems(searched,state.sort,state.q);
        if(sorted.length===0){if(statusEl){if(state.q)statusEl.textContent='No products found for "'+state.q+'".';else if(state.categoryRaw)statusEl.textContent='No products found for "'+state.categoryRaw+'".';else statusEl.textContent='No published products yet.'}if(labelEl)labelEl.textContent='0 pieces';gridEl.innerHTML='';return}
        if(statusEl)statusEl.textContent='';if(labelEl)labelEl.textContent=sorted.length+' piece'+(sorted.length===1?'':'s');
        gridEl.innerHTML=sorted.slice(0,12).map(function(p){
          var title=escapeHtml((p.title||'Product').toString());var slug=encodeURIComponent((p.slug||'').toString());var price=escapeHtml(moneyFromCents(p.price_cents,p.currency));
          var img=escapeHtml(normalizeCatalogImageUrl((p.image_url||'images/product-thumb-1.jpg').toString()));
          var href=slug?'product.html?slug='+slug:'product.html';
          var pfMapJson = p.printful_variant_map ? JSON.stringify(p.printful_variant_map) : '';
          var pfSizes = p.sizes ? (p.sizes||'').split(',').map(function(s){return s.trim();}).filter(Boolean) : [];
          var arTag = p.ar_target_id ? '<span class="ar-layer-tag">AR Layer</span>' : '<span class="ar-layer-tag is-muted">No layer yet</span>';
          return '<div class="col-md-3 col-sm-6 mb-4"><div class="shop-card"><a href="'+escapeHtml(href)+'" class="shop-card-image d-block"><img src="'+img+'" alt="'+title+'"></a>'
            +'<div class="shop-card-body"><div class="shop-card-title">'+title+'</div>'+arTag
            +'<div class="shop-card-meta"><span class="shop-card-price">From '+price+'</span>'
            +'<a href="#" class="btn btn-sm btn-outline-dark shop-card-buy" style="font-size:.72rem;padding:.3rem .9rem" data-sku="'+escapeHtml((p.slug||'').toString())+'" data-href="'+escapeHtml(href)+'" data-printful-variant="'+escapeHtml(String(p.printful_sync_variant_id||''))+'" data-printful-variant-map="'+escapeHtml(pfMapJson)+'" data-sizes="'+escapeHtml(pfSizes.join(','))+'">Add</a></div></div></div></div>';
        }).join('');
      }catch(e){if(statusEl)statusEl.textContent='Failed to load products.';if(labelEl)labelEl.textContent='';gridEl.innerHTML='';console.warn('Shop products failed:',e)}
    }

    function bindShopControls(){
      var searchEl=document.getElementById('shopSearchInput');var sortEl=document.getElementById('shopSortSelect');setShopControlsFromUrl();var t=null;
      if(searchEl)searchEl.addEventListener('input',function(){if(t)clearTimeout(t);t=setTimeout(function(){updateShopUrlParams({q:searchEl.value});setShopControlsFromUrl();renderShopProducts()},200)});
      if(sortEl)sortEl.addEventListener('change',function(){updateShopUrlParams({sort:sortEl.value});setShopControlsFromUrl();renderShopProducts()});
      document.querySelectorAll('.shop-cat-pill').forEach(function(p){p.addEventListener('click',function(){updateShopUrlParams({category:p.getAttribute('data-cat')||''});setShopControlsFromUrl();renderShopProducts()})});
      window.addEventListener('popstate',function(){setShopControlsFromUrl();renderShopProducts()});
    }

    function slugify(s){return(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}
    // Size picker state
    var _shopBuyPending = null;
    document.addEventListener('click',function(e){
      // Handle size picker buttons inside modal
      var sizePickBtn = e.target.closest('[data-pick-size]');
      if (sizePickBtn && _shopBuyPending) {
        e.preventDefault();
        var size = sizePickBtn.getAttribute('data-pick-size');
        var item = _shopBuyPending;
        var variantMap = item.variantMap || {};
        var pfVariantId = (size && variantMap[size]) ? variantMap[size] : (item.pfVariant || null);
        var cartId = item.sku ? ('sku-'+item.sku+'-'+size) : ('sku-'+slugify(item.name)+'-'+size);
        Cart.add({id:cartId,slug:item.sku||'',size:size,name:item.name+' ('+size+')',price:item.price,image:item.image,qty:1,printful_sync_variant_id:pfVariantId});
        CartUI.render();
        var modalEl = document.getElementById('shopSizePickerModal');
        if (modalEl && window.bootstrap) { var bsModal = bootstrap.Modal.getInstance(modalEl); if (bsModal) bsModal.hide(); }
        _shopBuyPending = null;
        return;
      }
      var btn=e.target.closest('.shop-card-buy');if(!btn)return;e.preventDefault();
      var card=btn.closest('.shop-card');if(!card)return;
      var name=(card.querySelector('.shop-card-title')||{}).textContent||'Product';
      var priceEl=card.querySelector('.shop-card-price');
      var priceText=priceEl?(priceEl.textContent||'').replace(/[^0-9.]/g,''):'0';
      var price=parseFloat(priceText||'0');
      var imgEl=card.querySelector('.shop-card-image img');
      var image=imgEl?imgEl.getAttribute('src'):'';
      var sku=(btn.getAttribute('data-sku')||'').trim();
      var pfVariant=(btn.getAttribute('data-printful-variant')||'').trim()||null;
      var pfMapRaw=(btn.getAttribute('data-printful-variant-map')||'').trim();
      var variantMap={};try{if(pfMapRaw)variantMap=JSON.parse(pfMapRaw);}catch(e){}
      var sizesRaw=(btn.getAttribute('data-sizes')||'').trim();
      var sizes=sizesRaw?sizesRaw.split(',').filter(Boolean):[];
      var id=sku?('sku-'+sku):('sku-'+slugify(name));
      if(sizes.length>1){
        _shopBuyPending={sku:sku,name:name,price:price,image:image,pfVariant:pfVariant,variantMap:variantMap};
        var modalBody=document.getElementById('shopSizePickerBody');
        if(modalBody){modalBody.innerHTML='<div class="d-flex flex-wrap gap-2 justify-content-center">'+sizes.map(function(s){return'<button class="btn btn-outline-dark px-4 py-2" data-pick-size="'+s+'">'+s+'</button>';}).join('')+'</div>';}
        var modalEl=document.getElementById('shopSizePickerModal');
        if(modalEl&&window.bootstrap){new bootstrap.Modal(modalEl).show();}
        return;
      }
      var resolvedVariant=(sizes.length===1&&variantMap[sizes[0]])?variantMap[sizes[0]]:pfVariant;
      Cart.add({id:id,slug:sku,size:sizes.length===1?sizes[0]:null,name:name+(sizes.length===1?' ('+sizes[0]+')':''),price:price,image:image,qty:1,printful_sync_variant_id:resolvedVariant});CartUI.render();
    });
    bindShopControls();renderShopProducts();CartUI.render();
  </script>
</body>
</html>
