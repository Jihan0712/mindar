<!DOCTYPE html>
<html lang="en">
<head>
  <title>Shop — Drop 04 | INRL</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="/assets/js/auth-worker.js?v=20260205"></script>
  <style>
    .shop-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
    .shop-tools{display:grid;gap:14px;margin-top:28px}
    @media (min-width:1024px){.shop-tools{grid-template-columns:1fr 220px;gap:16px;margin-top:32px}}
    .shop-tools .input,.shop-tools .select{min-height:52px}
    .shop-chips{margin:24px 0 48px}
    @media (max-width:1023.98px){.shop-head{display:block}.shop-head .t-meta{margin-top:16px}.shop-tools .select{display:none}.shop-chips{margin:18px 0 32px}}
    .more{margin-top:40px}
    @media (min-width:1024px){.more{display:none}}
  </style>
</head>
<body class="site">
  <div id="site-header" data-page="shop"></div>

  <main id="main" class="page-top" style="padding-bottom:128px">
    <div class="wrap">
      <div class="shop-head">
        <h1 class="t-page" id="shopTitle">Drop 04<br>SS26</h1>
        <p class="t-meta tnum" id="shopCount" style="margin:0" aria-live="polite"></p>
      </div>

      <div class="shop-tools">
        <form class="input-wrap" role="search" id="shopSearchForm">
          <svg class="input-icon" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          <label for="shopSearchInput" class="visually-hidden">Search pieces</label>
          <input type="search" id="shopSearchInput" class="input input--pill" placeholder="Search pieces" autocomplete="off">
        </form>
        <label for="shopSortSelect" class="visually-hidden">Sort</label>
        <select id="shopSortSelect" class="select select--pill">
          <option value="relevance">Newest first</option>
          <option value="price_asc">Price: low to high</option>
          <option value="price_desc">Price: high to low</option>
        </select>
      </div>

      <div class="chips shop-chips" role="group" aria-label="Filter by category">
        <button type="button" class="chip" data-cat="" aria-pressed="true">All</button>
        <button type="button" class="chip" data-cat="Men" aria-pressed="false">Men</button>
        <button type="button" class="chip" data-cat="Women" aria-pressed="false">Women</button>
        <button type="button" class="chip" data-cat="Accessories" aria-pressed="false">Accessories</button>
      </div>

      <div class="pgrid" id="shopGrid" aria-live="polite"></div>
      <div id="shopEmpty" hidden></div>
      <div class="more" id="shopMore" hidden><button type="button" class="b b--ghost b--block" id="shopMoreBtn"></button></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>
  <script>
    (function () {
      var esc = INRL.esc;
      var MOBILE_PAGE = 6;
      var showAll = false;
      var grid = document.getElementById('shopGrid');
      var countEl = document.getElementById('shopCount');
      var emptyEl = document.getElementById('shopEmpty');
      var moreWrap = document.getElementById('shopMore');
      var moreBtn = document.getElementById('shopMoreBtn');
      var searchEl = document.getElementById('shopSearchInput');
      var sortEl = document.getElementById('shopSortSelect');

      function norm(s) { return String(s || '').trim().toLowerCase(); }
      function state() {
        var u = new URL(location.href);
        return { cat: (u.searchParams.get('category') || '').trim(), q: (u.searchParams.get('q') || '').trim(), sort: (u.searchParams.get('sort') || 'relevance').trim() };
      }
      function setParam(k, v) {
        var u = new URL(location.href);
        if (v && !(k === 'sort' && v === 'relevance')) u.searchParams.set(k, v); else u.searchParams.delete(k);
        history.replaceState(null, '', u.toString());
      }
      function matches(p, q) {
        q = norm(q); if (!q) return true;
        return [p.title, p.category, p.brand, p.color].some(function (f) { return norm(f).indexOf(q) !== -1; });
      }
      function created(p) { var t = Date.parse(p && (p.created_at || p.updated_at)); return isFinite(t) ? t : Number(p && p.id) || 0; }
      function sortItems(list, sort) {
        list = list.slice();
        if (sort === 'price_asc') list.sort(function (a, b) { return (a.price_cents || 0) - (b.price_cents || 0); });
        else if (sort === 'price_desc') list.sort(function (a, b) { return (b.price_cents || 0) - (a.price_cents || 0); });
        else list.sort(function (a, b) { return created(b) - created(a); });
        return list;
      }
      function syncControls() {
        var s = state();
        if (document.activeElement !== searchEl) searchEl.value = s.q;
        sortEl.value = ['relevance', 'price_asc', 'price_desc'].indexOf(s.sort) !== -1 ? s.sort : 'relevance';
        document.querySelectorAll('.chip[data-cat]').forEach(function (c) {
          c.setAttribute('aria-pressed', norm(c.getAttribute('data-cat')) === norm(s.cat) ? 'true' : 'false');
        });
      }

      var ALL = null;
      function render() {
        var s = state();
        syncControls();
        if (!ALL) return;
        var soldOut = ALL.filter(INRL.isSoldOut).length;
        countEl.textContent = ALL.length + ' piece' + (ALL.length === 1 ? '' : 's') + (soldOut ? ' · ' + soldOut + ' sold out' : '');
        var list = ALL.filter(function (p) { return !s.cat || norm(p.category).indexOf(norm(s.cat)) !== -1; })
                      .filter(function (p) { return matches(p, s.q); });
        list = sortItems(list, s.sort);

        if (!list.length) {
          grid.innerHTML = '';
          moreWrap.hidden = true;
          emptyEl.hidden = false;
          emptyEl.innerHTML = '<div class="empty" style="padding-top:8px"><p class="t-label">' + (s.q ? 'Search' : 'Shop') + '</p>'
            + '<h2 class="t-task">Nothing for &ldquo;' + esc(s.q || s.cat) + '&rdquo;.</h2>'
            + '<p class="t-lead">We make a small number of pieces at a time. Clear the filter to see everything currently made.</p>'
            + '<div class="b-row"><a class="b" href="shop.html">See the drop</a><a class="b b--ghost" href="contact.html?topic=request">Tell us what to make</a></div></div>';
          return;
        }
        emptyEl.hidden = true;
        var small = window.matchMedia('(max-width: 1023.98px)').matches;
        var shown = (small && !showAll) ? list.slice(0, MOBILE_PAGE) : list;
        grid.innerHTML = shown.map(INRL.productCard).join('');
        moreWrap.hidden = !(small && !showAll && list.length > MOBILE_PAGE);
        moreBtn.textContent = 'Show all ' + list.length + ' pieces';
      }

      var t = null;
      searchEl.addEventListener('input', function () { clearTimeout(t); t = setTimeout(function () { setParam('q', searchEl.value.trim()); render(); }, 180); });
      document.getElementById('shopSearchForm').addEventListener('submit', function (e) { e.preventDefault(); setParam('q', searchEl.value.trim()); render(); });
      sortEl.addEventListener('change', function () { setParam('sort', sortEl.value); render(); });
      document.querySelectorAll('.chip[data-cat]').forEach(function (c) {
        c.addEventListener('click', function () { setParam('category', c.getAttribute('data-cat')); render(); });
      });
      moreBtn.addEventListener('click', function () { showAll = true; render(); });
      window.addEventListener('popstate', render);

      syncControls();
      grid.innerHTML = INRL.skeletonCards(8);
      INRL.fetchProducts().then(function (items) {
        ALL = items;
        if (!items.length) {
          grid.innerHTML = '';
          emptyEl.hidden = false;
          emptyEl.innerHTML = '<div class="empty" style="padding-top:8px"><h2 class="t-task">The next drop is being made.</h2><p class="t-lead">Nothing is on sale right now. Sign up at the bottom of the page and we will write when it opens.</p></div>';
          return;
        }
        render();
      }).catch(function () {
        grid.innerHTML = '';
        emptyEl.hidden = false;
        emptyEl.innerHTML = '<div class="empty" style="padding-top:8px"><h2 class="t-task">Something broke on our side.</h2><p class="t-lead">The shop could not be loaded. Nothing you did caused it.</p><button class="b" type="button" onclick="location.reload()">Try again</button></div>';
      });
    })();
  </script>
</body>
</html>
