<!DOCTYPE html>
<html lang="en">
<head>
  <title>Contact | INRL</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="css/vendor.css">
  <link rel="stylesheet" type="text/css" href="css/global.css">
  <script src="/assets/js/auth-worker.js?v=20260205"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none"><defs>
    <symbol id="instagram" viewBox="0 0 15 15"><path fill="none" stroke="currentColor" d="M11 3.5h1M4.5.5h6a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-6a4 4 0 0 1-4-4v-6a4 4 0 0 1 4-4Zm3 10a3 3 0 1 1 0-6a3 3 0 0 1 0 6Z"/></symbol>
    <symbol id="facebook" viewBox="0 0 15 15"><path fill="none" stroke="currentColor" d="M7.5 14.5a7 7 0 1 1 0-14a7 7 0 0 1 0 14Zm0 0v-8a2 2 0 0 1 2-2h.5m-5 4h5"/></symbol>
    <symbol id="twitter" viewBox="0 0 15 15"><path fill="currentColor" d="m14.478 1.5l.5-.033a.5.5 0 0 0-.871-.301l.371.334Zm-.498 2.959a.5.5 0 1 0-1 0h1Zm-6.49.082h-.5h.5Zm0 .959h.5h-.5Zm-6.99 7V12a.5.5 0 0 0-.278.916L.5 12.5Zm.998-11l.469-.175a.5.5 0 0 0-.916-.048l.447.223Zm3.994 9l.354.353a.5.5 0 0 0-.195-.827l-.159.474Z"/></symbol>
  </defs></svg>

  <div class="preloader text-white fs-6 text-uppercase overflow-hidden"></div>

  <div id="site-header" data-page="contact"></div>

  <div style="padding:132px 0 32px;background:var(--surface-0)">
    <div class="container">
      <h1 class="mb-0" style="color:var(--ink-900);text-transform:uppercase;font-size:clamp(36px,5vw,64px);letter-spacing:-0.03em">Contact</h1>
    </div>
  </div>

  <section class="pb-5" style="background:var(--surface-0)">
    <div class="container">
      <div class="row g-5">
        <div class="col-lg-5">
          <div style="background:var(--surface-50);border-radius:12px;padding:32px">
            <h5 class="mb-4" style="font-family:var(--font-display);text-transform:uppercase;color:var(--ink-900)">Get in touch</h5>
            <div class="mb-3"><span class="eyebrow">Email</span><p class="mb-0"><a href="mailto:contact@inrl.co" style="color:var(--ink-900)">contact@inrl.co</a></p></div>
            <div class="mb-3"><span class="eyebrow">Phone</span><p class="mb-0"><a href="tel:+43720115278" style="color:var(--ink-900)">+43 720 11 52 78</a></p></div>
            <div class="mb-3"><span class="eyebrow">Location</span><p class="mb-0" style="color:var(--ink-900)">Vienna, Austria</p></div>
            <div class="d-flex gap-3 mt-4">
              <a href="#" style="color:var(--ink-700)"><svg width="18" height="18" viewBox="0 0 15 15"><use xlink:href="#instagram"></use></svg></a>
              <a href="#" style="color:var(--ink-700)"><svg width="18" height="18" viewBox="0 0 15 15"><use xlink:href="#facebook"></use></svg></a>
              <a href="#" style="color:var(--ink-700)"><svg width="18" height="18" viewBox="0 0 15 15"><use xlink:href="#twitter"></use></svg></a>
            </div>
          </div>
        </div>
        <div class="col-lg-7">
          <form id="contactForm" style="background:var(--surface-50);border-radius:12px;padding:32px">
            <h5 class="mb-4" style="font-family:var(--font-display);text-transform:uppercase;color:var(--ink-900)">Send a message</h5>
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Name</label><input type="text" class="form-control" required></div>
              <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" required></div>
              <div class="col-12"><label class="form-label">Subject</label><input type="text" class="form-control" required></div>
              <div class="col-12"><label class="form-label">Message</label><textarea class="form-control" rows="5" required></textarea></div>
            </div>
            <div id="contactStatus" class="mt-3 mb-2" style="font-size:14px;color:var(--accent-700)"></div>
            <button type="submit" class="btn btn-primary btn-lg mt-2">Send message</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/jquery.min.js"></script>
  <script src="js/plugins.js"></script>
  <script src="js/SmoothScroll.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
  <script src="js/script.min.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>
  <script>
  document.getElementById('contactForm').addEventListener('submit',function(e){e.preventDefault();var s=document.getElementById('contactStatus');if(s)s.textContent='Message sent! (demo)';e.target.reset()});
  </script>
</body>
</html>
