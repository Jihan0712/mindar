<!DOCTYPE html>
<html lang="en">
<head>
  <title>Checkout | INRL</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="css/vendor.css">
  <link rel="stylesheet" type="text/css" href="css/global.css">
  <script src="/assets/js/auth-worker.js?v=20260205"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <div class="preloader text-white fs-6 text-uppercase overflow-hidden"></div>

  <div id="site-header" data-page="checkout"></div>

  <section style="padding:132px 0 100px">
    <div class="container">
      <h1 class="mb-4" style="font-family:var(--font-display);text-transform:uppercase;letter-spacing:-0.02em;color:var(--ink-900);font-size:clamp(28px,4vw,40px)">Checkout</h1>
      <div class="row g-5">
        <div class="col-lg-7">
          <form id="checkout-form">
            <div style="background:var(--surface-50);border-radius:12px;padding:28px;margin-bottom:24px">
              <h5 class="mb-3" style="font-family:var(--font-display);text-transform:uppercase;color:var(--ink-900)">Billing details</h5>
              <div class="row g-3">
                <div class="col-md-6"><label for="firstName" class="form-label">First name</label><input type="text" class="form-control" id="firstName" required></div>
                <div class="col-md-6"><label for="lastName" class="form-label">Last name</label><input type="text" class="form-control" id="lastName" required></div>
                <div class="col-12"><label for="email" class="form-label">Email</label><input type="email" class="form-control" id="email" required></div>
                <div class="col-12"><label for="address" class="form-label">Address</label><input type="text" class="form-control" id="address" required></div>
                <div class="col-12"><label for="city" class="form-label">City</label><input type="text" class="form-control" id="city" required></div>
                <div class="col-md-5"><label for="country" class="form-label">Country</label><select class="form-select" id="country" required><option value="">Choose</option><option>United States</option><option>United Kingdom</option><option>Canada</option><option>Australia</option></select></div>
                <div class="col-md-4"><label for="state" class="form-label">State</label><input type="text" class="form-control" id="state" required></div>
                <div class="col-md-3"><label for="zip" class="form-label">Zip</label><input type="text" class="form-control" id="zip" required></div>
              </div>
            </div>
            <div class="d-flex align-items-center gap-2 mb-4" style="font-size:13px;color:var(--ink-500)">
              You'll enter your card details on Stripe's secure payment page in the next step — this site never sees your card number.
            </div>
            <div id="order-status" class="mb-3" style="font-size:14px"></div>
            <button type="submit" id="place-order" class="btn btn-primary btn-lg w-100">Continue to payment</button>
          </form>
        </div>
        <div class="col-lg-5">
          <div style="background:var(--surface-50);border-radius:12px;padding:28px;position:sticky;top:100px">
            <h5 class="mb-3" style="font-family:var(--font-display);text-transform:uppercase;color:var(--ink-900)">Order summary</h5>
            <div id="cart-count" style="display:none">0</div>
            <ul id="cart-list" class="list-group mb-3" style="background:transparent;border:none"></ul>
            <div class="d-flex justify-content-between align-items-center pt-3" style="border-top:1px solid var(--line-200)">
              <strong>Total</strong>
              <strong class="fs-4" id="cart-total" style="font-family:var(--font-display)">$0.00</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/jquery.min.js"></script>
  <script src="js/plugins.js"></script>
  <script src="js/SmoothScroll.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  <script src="js/script.min.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>
  <script>
  CartUI.render();
  </script>
</body>
</html>
