<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | INRL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="css/vendor.css">
  <link rel="stylesheet" type="text/css" href="css/global.css">
  <script src="/assets/js/auth-worker.js?v=20260401"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    .auth-input{background:var(--surface-0);border:1px solid var(--line-200);color:var(--ink-900);border-radius:10px !important;padding:12px 14px;font-family:var(--font-body);font-size:14px}
    .auth-input:focus{border-color:var(--accent-500);box-shadow:0 0 0 3px rgba(18,162,184,.12)}
    .auth-eye{position:absolute;top:50%;right:12px;transform:translateY(-50%);background:none;border:none;color:var(--ink-500);cursor:pointer;padding:0;line-height:1}
  </style>
</head>
<body>

  <div id="site-header" data-page="login"></div>

  <!-- LOGIN -->
  <section style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:120px 16px 60px;background:var(--surface-50)">
    <div style="width:100%;max-width:420px">

      <div class="text-center mb-4">
        <a href="index.html"><img src="images/main-logo.png" alt="INRL" style="height:32px" data-site-logo></a>
      </div>

      <div style="border:1px solid var(--line-200);border-radius:16px;padding:40px 36px;background:var(--surface-0)">
        <h1 class="mb-1" style="font-family:var(--font-display);font-size:26px;color:var(--ink-900);letter-spacing:-0.02em;text-transform:uppercase">Sign in</h1>
        <p style="font-size:13px;color:var(--ink-500);margin-bottom:28px" id="authSubtitle">Welcome back to INRL.</p>

        <div id="status" style="font-size:13px;margin-bottom:16px;display:none"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="emailInput" class="form-label">Email</label>
            <input type="email" id="emailInput" class="form-control auth-input" autocomplete="username" required>
          </div>
          <div class="mb-3" id="passwordField">
            <div class="d-flex justify-content-between align-items-center">
              <label for="passwordInput" class="form-label mb-1">Password</label>
              <a href="#" id="forgotLink" style="font-size:12px;color:var(--accent-700)">Forgot?</a>
            </div>
            <div style="position:relative">
              <input type="password" id="passwordInput" class="form-control auth-input" autocomplete="current-password" required style="padding-right:44px">
              <button type="button" id="togglePw" class="auth-eye" aria-label="Show password">
                <svg id="pwEyeShow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="pwEyeHide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary w-100 mt-3">Sign in</button>
        </form>

        <div class="text-center mt-4" style="font-size:13px;color:var(--ink-500)">
          Don't have an account?
          <a href="signup.html" style="color:var(--accent-700);font-weight:500">Create one</a>
        </div>
      </div>

    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="js/cart.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>
  <script>
    (function () {
      const qs = new URLSearchParams(location.search);
      const nextParam = qs.get('next');

      function getRedirect(user) {
        if (nextParam) return nextParam;
        if (!user) return 'index.html';
        if (user.role === 'admin') return '/admin.html';
        if (user.role === 'brand') return '/brand.html';
        return 'index.html';
      }

      const statusEl = document.getElementById('status');
      function showStatus(msg, type) {
        statusEl.textContent = msg;
        statusEl.style.display = msg ? '' : 'none';
        statusEl.style.color = type === 'error' ? 'var(--danger-500)' : 'var(--accent-700)';
      }

      // If already signed in redirect immediately
      auth.me().then(user => {
        if (user) location.href = getRedirect(user);
      });

      // Password toggle
      const pwInput = document.getElementById('passwordInput');
      const eyeShow = document.getElementById('pwEyeShow');
      const eyeHide = document.getElementById('pwEyeHide');
      document.getElementById('togglePw').addEventListener('click', () => {
        const isHidden = pwInput.type === 'password';
        pwInput.type = isHidden ? 'text' : 'password';
        eyeShow.style.display = isHidden ? 'none' : '';
        eyeHide.style.display = isHidden ? '' : 'none';
      });

      // Forgot password — no reset-email backend exists yet, so this is an honest
      // dead-end to support rather than a flow that pretends to send an email.
      const form = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const forgotLink = document.getElementById('forgotLink');
      let forgotMode = false;
      forgotLink.addEventListener('click', (e) => {
        e.preventDefault();
        forgotMode = !forgotMode;
        document.getElementById('passwordField').style.display = forgotMode ? 'none' : '';
        document.getElementById('authSubtitle').textContent = forgotMode ? 'Enter your email and we\'ll help you back in.' : 'Welcome back to INRL.';
        submitBtn.textContent = forgotMode ? 'Get help signing in' : 'Sign in';
        forgotLink.textContent = forgotMode ? 'Back to sign in' : 'Forgot?';
        showStatus('', '');
      });

      // Form submission
      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const email = document.getElementById('emailInput').value.trim();
        if (forgotMode) {
          if (!email) { showStatus('Enter your email first.', 'error'); return; }
          showStatus('Password reset isn’t available yet — email contact@inrl.co from ' + email + ' and we’ll get you back in.', 'success');
          return;
        }
        const password = document.getElementById('passwordInput').value;
        if (!email || !password) {
          showStatus('Please enter your email and password.', 'error');
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in…';
        showStatus('', '');
        try {
          await auth.login(email, password);
          const user = await auth.me();
          showStatus('Signed in! Redirecting…', 'success');
          location.href = getRedirect(user);
        } catch (e) {
          showStatus(e?.message || 'Sign in failed. Check your credentials.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign in';
        }
      });
    })();
  </script>
</body>
</html>
