<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — INRL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="css/vendor.css">
  <link rel="stylesheet" type="text/css" href="css/global.css">
  <script src="/assets/js/auth-worker.js?v=20260401"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>

  <div id="site-header" data-page="login"></div>

  <!-- LOGIN SECTION -->
  <section style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:100px 16px 60px;background:#1C1C1C">
    <div style="width:100%;max-width:440px">

      <!-- Logo mark -->
      <div class="text-center mb-4">
        <a href="index.html" ><img src="images/main-logo.png" alt="INRL" style="height:48px"></a>
      </div>

      <div style="border:3px solid rgba(245,245,240,.15);box-shadow:6px 6px 0 rgba(0,237,10,.15);padding:40px 36px;background:#212121">
        <h1 class="text-uppercase mb-1" style="font-family:'Averia Serif Libre',serif;font-size:28px;color:#F5F5F0;letter-spacing:-0.03em">Sign In</h1>
        <p style="font-size:13px;color:rgba(245,245,240,.4);margin-bottom:28px">Welcome back to INRL.</p>

        <div id="status" style="font-size:13px;margin-bottom:16px;display:none"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="emailInput" class="form-label text-uppercase" style="font-size:11px;font-weight:700;letter-spacing:.12em;color:rgba(245,245,240,.55)">Email</label>
            <input type="email" id="emailInput" class="form-control" autocomplete="username" required
              style="background:#1C1C1C;border:2px solid rgba(245,245,240,.2);color:#F5F5F0;border-radius:0;padding:12px 14px;font-family:'Roboto Mono',monospace;font-size:14px">
          </div>
          <div class="mb-4">
            <label for="passwordInput" class="form-label text-uppercase" style="font-size:11px;font-weight:700;letter-spacing:.12em;color:rgba(245,245,240,.55)">Password</label>
            <div style="position:relative">
              <input type="password" id="passwordInput" class="form-control" autocomplete="current-password" required
                style="background:#1C1C1C;border:2px solid rgba(245,245,240,.2);color:#F5F5F0;border-radius:0;padding:12px 14px;font-family:'Roboto Mono',monospace;font-size:14px;padding-right:44px">
              <button type="button" id="togglePw" aria-label="Show password"
                style="position:absolute;top:50%;right:12px;transform:translateY(-50%);background:none;border:none;color:rgba(245,245,240,.4);cursor:pointer;padding:0;line-height:1">
                <svg id="pwEyeShow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="pwEyeHide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" id="submitBtn"
            style="width:100%;padding:14px;font-family:'Roboto Mono',monospace;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;background:#00ED0A;color:#1C1C1C;border:3px solid #1C1C1C;cursor:pointer;box-shadow:4px 4px 0 rgba(0,237,10,.35);transition:transform .1s,box-shadow .1s"
            onmouseover="this.style.transform='translate(-2px,-2px)';this.style.boxShadow='6px 6px 0 rgba(0,237,10,.35)'"
            onmouseout="this.style.transform='';this.style.boxShadow='4px 4px 0 rgba(0,237,10,.35)'">
            Sign In
          </button>
        </form>

        <div class="text-center mt-4" style="font-size:13px;color:rgba(245,245,240,.4)">
          Don't have an account?
          <a href="signup.html" style="color:#00ED0A;text-decoration:none;font-weight:600">Create one</a>
        </div>
      </div>

    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="js/cart.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>
  <script>
    (function () {
      const qs = new URLSearchParams(location.search);
      const nextParam = qs.get('next');

      function getRedirect(user) {
        if (nextParam) return nextParam;
        if (!user) return 'index.html';
        if (user.role === 'admin') return '/admin.html';
        if (user.role === 'brand') return '/brand.html';
        return 'index.html';
      }

      const statusEl = document.getElementById('status');
      function showStatus(msg, type) {
        statusEl.textContent = msg;
        statusEl.style.display = msg ? '' : 'none';
        statusEl.style.color = type === 'error' ? '#ff4d4f' : '#00ED0A';
      }

      // If already signed in redirect immediately
      auth.me().then(user => {
        if (user) location.href = getRedirect(user);
      });

      // Password toggle
      const pwInput = document.getElementById('passwordInput');
      const eyeShow = document.getElementById('pwEyeShow');
      const eyeHide = document.getElementById('pwEyeHide');
      document.getElementById('togglePw').addEventListener('click', () => {
        const isHidden = pwInput.type === 'password';
        pwInput.type = isHidden ? 'text' : 'password';
        eyeShow.style.display = isHidden ? 'none' : '';
        eyeHide.style.display = isHidden ? '' : 'none';
      });

      // Form submission
      const form = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;
        if (!email || !password) {
          showStatus('Please enter your email and password.', 'error');
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in…';
        showStatus('', '');
        try {
          await auth.login(email, password);
          const user = await auth.me();
          showStatus('Signed in! Redirecting…', 'success');
          location.href = getRedirect(user);
        } catch (e) {
          showStatus(e?.message || 'Sign in failed. Check your credentials.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });
    })();
  </script>
</body>
</html>
