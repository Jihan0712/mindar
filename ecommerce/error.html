<!DOCTYPE html>
<html lang="en">
<head>
  <title>Not here | INRL</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <base href="/ecommerce/">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="/assets/js/auth-worker.js?v=20260205"></script>
</head>
<body class="site">
  <div id="site-header"></div>

  <main id="main">
    <!-- Also the server-error layout (Handoff · Gaps): ?e=500 swaps the copy. -->
    <section class="wrap wrap--focus" style="padding-block:40px 112px">
      <div class="empty" style="padding-bottom:56px">
        <p class="t-label" id="eCode">404</p>
        <h1 class="t-task" id="eTitle">This page is<br>not here.</h1>
        <p class="t-lead" id="eBody">Either the link is wrong, or the piece it pointed at is no longer made. If you scanned a print and landed here, the marker is not registered to a layer yet &mdash; the owner has not published one.</p>
        <div class="b-row b-row--stack" id="eActions"><a class="b" href="shop.html">See the drop</a><a class="b b--ghost" href="/">Open the camera</a></div>
      </div>
      <p class="t-label" style="margin:0 0 16px">In the drop now</p>
      <div class="pgrid" id="dropNow"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>
  <script>
    (function () {
      if (new URLSearchParams(location.search).get('e') === '500') {
        document.title = 'Something broke | INRL';
        document.getElementById('eCode').textContent = 'Error';
        document.getElementById('eTitle').innerHTML = 'Something broke<br>on our side.';
        document.getElementById('eBody').textContent = 'Nothing you did caused it, and nothing was charged. Try again in a moment — if it keeps happening, write to contact@inrl.co.';
        document.getElementById('eActions').innerHTML = '<button class="b" type="button" onclick="history.length > 1 ? history.back() : location.reload()">Try again</button><a class="b b--ghost" href="shop.html">See the drop</a>';
      }
      var g = document.getElementById('dropNow');
      g.innerHTML = INRL.skeletonCards(4);
      INRL.fetchProducts().then(function (l) { g.innerHTML = l.slice(0, 4).map(INRL.productCardRow).join(''); if (!l.length) g.previousElementSibling.hidden = true; })
        .catch(function () { g.innerHTML = ''; g.previousElementSibling.hidden = true; });
    })();
  </script>
</body>
</html>
