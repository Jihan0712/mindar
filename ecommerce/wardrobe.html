<!DOCTYPE html>
<html lang="en">
<head>
  <title>Your T-shirts | InRL</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="/assets/js/auth-worker.js?v=20260205"></script>
  <style>
    /* Phone sub-nav (M-12 · M-27 · M-38) — the desktop rail covers this ≥1024 */
    .app-tabs{display:flex;gap:8px;margin:-8px 0 24px;overflow-x:auto;scrollbar-width:none}
    .app-tabs::-webkit-scrollbar{display:none}
    .app-tabs a{flex-shrink:0;padding:7px 14px;border-radius:999px;background:var(--surface-3);color:var(--ink-700);font-size:13px;line-height:1;text-decoration:none}
    .app-tabs a[aria-current="page"]{background:var(--teal-200);color:var(--ink-900)}

    .wgrid{display:grid;gap:16px}
    @media (min-width:1024px){.wgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}}
    .wcard{background:var(--surface-0);display:flex;flex-direction:column;color:inherit;text-decoration:none;min-width:0}
    .wcard .ph{aspect-ratio:272/300;background:var(--surface-3)}
    .wcard__body{padding:16px;display:flex;flex-direction:column;flex:1}
    .wcard h3{font:400 16px/1.3 var(--font-body);color:var(--ink-900);margin:8px 0 4px;text-transform:none;letter-spacing:0;overflow-wrap:anywhere}
    .wcard .meta{font-size:13px;color:var(--ink-500);line-height:1.6}
    .wcard .meta+.meta{color:var(--ink-700)}
    .wcard__foot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line-100);margin-top:auto;padding-top:10px;font-size:13px;color:var(--ink-500)}
    .wcard__body > :nth-last-child(2){margin-bottom:10px}
    .wcard__act{color:var(--accent-700);font-weight:500;margin-left:auto}
    .wcard:hover .wcard__act{text-decoration:underline}
    @media (max-width:1023.98px){
      .wcard{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:12px;border:1px solid var(--line-100)}
      .wcard .ph{aspect-ratio:auto;height:64px;font-size:9px}
      .wcard__body{padding:0}
      .wcard h3{margin:4px 0 2px}
      .wcard__body > :nth-last-child(2){margin-bottom:0}
      .wcard__foot{border:0;padding-top:4px;font-size:12px}
    }

    .empty-card{background:var(--surface-0);border:1px dashed var(--line-200);text-align:center;padding:48px 24px}
    @media (min-width:1024px){.empty-card{padding:56px 120px}}
    .empty-card h2{font:500 24px/1.1 var(--font-display);text-transform:uppercase;color:var(--ink-900);margin:16px 0 12px}
    .empty-card p{max-width:520px;margin:0 auto 20px;font-size:14px}
  </style>
</head>
<body class="site app">
  <div id="site-header" data-page="account"></div>

  <div class="shell">
    <aside class="rail" id="app-rail" data-active="wardrobe"></aside>
    <main id="main" class="app__main">
      <nav class="app-tabs d-lg-none" aria-label="Account">
        <a href="wardrobe.html" aria-current="page">Your T-shirts</a>
        <a href="account.html">Settings</a>
        <a href="order-tracking.html">Orders</a>
      </nav>

      <div class="app-head">
        <div>
          <h1>Your T-shirts</h1>
          <p id="summary">Loading your T-shirts&hellip;</p>
        </div>
      </div>

      <div class="wgrid" id="grid" aria-live="polite"></div>

      <!-- W-06 · No purchases  /  W-11 · Purchased T-shirt missing (proposed) -->
      <div id="empty" hidden>
        <div class="empty-card">
          <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 2v22M2 13h22" stroke="var(--ink-900)" stroke-width="1.5"/></svg>
          <h2 id="emptyTitle">No T-shirts yet</h2>
          <p id="emptyBody">Your purchased T-shirts will appear here.</p>
          <a class="b b--dark" id="emptyCta" href="shop.html">Shop T-shirts</a>
        </div>
      </div>

      <div id="error" hidden class="empty">
        <h2 class="t-title" style="text-transform:uppercase">Something broke on our side.</h2>
        <p class="t-lead" id="errorMsg" style="margin-top:12px"></p>
        <button class="b b--dark" type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
  </div>

  <div id="site-footer"></div>

  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>
  <script src="js/app-rail.js"></script>
  <script>
  (function () {
    var esc = INRL.esc;
    function plainTitle(t) { return String(t || '').replace(/^No\.\s*\d+\s+/, ''); }

    /* W-01 card: status, name, code · product, then Manage / Add your video. */
    function card(p) {
      var href = 'piece.html?id=' + encodeURIComponent(p.id);
      var live = !!p.is_published;
      var name = p.nickname || 'Untitled';
      var img = p.product && p.product.image_url ? '<img src="' + esc(INRL.imageUrl(p.product.image_url)) + '" alt="" loading="lazy" onerror="this.remove()">' : '';
      var meta = [p.claim_code, plainTitle(p.product && p.product.title)].filter(Boolean).join(' · ');
      return '<a class="wcard" href="' + href + '">'
        + '<div class="ph">' + img + '<span>T-shirt &middot; image pending</span></div>'
        + '<div class="wcard__body">'
        +   '<span class="sdot' + (live ? '' : ' sdot--draft') + '">' + (live ? 'Live' : 'No video') + '</span>'
        +   '<h3>' + esc(name) + '</h3>'
        +   '<div class="meta">' + esc(meta) + '</div>'
        +   (live ? '' : '<div class="meta d-none d-lg-block">No video added</div>')
        +   '<div class="wcard__foot">'
        +     (live ? '' : '<span><span class="d-none d-lg-inline">&mdash;</span><span class="d-lg-none">No video added</span></span>')
        +     '<span class="wcard__act">' + (live ? 'Manage' : 'Add your video') + '</span>'
        +   '</div>'
        + '</div></a>';
    }

    function showEmpty(missing) {
      document.getElementById('summary').textContent = 'No T-shirts yet';
      document.getElementById('empty').hidden = false;
      if (!missing) return;
      document.getElementById('emptyTitle').textContent = 'T-shirt missing?';
      document.getElementById('emptyBody').textContent = 'Bought a T-shirt but can’t see it? Check you’re using the account for your order, or contact us.';
      var cta = document.getElementById('emptyCta');
      cta.textContent = 'Contact us';
      cta.href = 'contact.html';
    }

    /* A paid order on this account with no T-shirt to show is a purchase that failed to
       appear (W-11), not an empty account (W-06). */
    async function hasPaidOrder() {
      try {
        var res = await fetch('/api/orders/mine', { credentials: 'include' });
        if (!res.ok) return false;
        var orders = ((await res.json()) || {}).items || [];
        return orders.some(function (o) { return o.payment_status === 'paid'; });
      } catch (e) { return false; }
    }

    AppRail.ready.then(async function () {
      try {
        var res = await fetch('/api/pieces', { credentials: 'include' });
        if (res.status === 401) { location.href = 'login.html?next=wardrobe.html'; return; }
        if (!res.ok) throw new Error('Your T-shirts could not be loaded (' + res.status + ').');
        var items = ((await res.json()) || {}).items || [];
        if (!items.length) { showEmpty(await hasPaidOrder()); return; }
        document.getElementById('summary').hidden = true;
        document.getElementById('grid').innerHTML = items.map(card).join('');
      } catch (e) {
        document.getElementById('summary').textContent = '';
        document.getElementById('error').hidden = false;
        document.getElementById('errorMsg').textContent = e.message;
      }
    });
  })();
  </script>
</body>
</html>
