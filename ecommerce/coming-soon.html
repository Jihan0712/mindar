<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming soon | INRL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="css/vendor.css">
  <link rel="stylesheet" type="text/css" href="css/global.css">

  <!-- Worker Auth Client (shared session + role) -->
  <script src="/assets/js/auth-worker.js?v=20260206"></script>
</head>
<body>
  <div id="site-header" data-page="coming-soon"></div>

  <main class="container text-center" style="max-width:560px;padding:180px 0 140px">
    <div class="eyebrow mb-3">Coming soon</div>
    <h1 id="title" class="mb-3" style="font-family:var(--font-display);text-transform:uppercase;letter-spacing:-0.03em;color:var(--ink-900);font-size:clamp(32px,5vw,56px)">Coming soon</h1>
    <p id="desc" class="mb-4" style="color:var(--ink-500)">This page isn't ready yet.</p>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a class="btn btn-primary btn-lg" href="shop.html">Back to shop</a>
      <a class="btn btn-outline-dark btn-lg" href="index.html">Home</a>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="js/cart.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/include.js"></script>
  <script>
    (function(){
      const page = (new URL(location.href)).searchParams.get('page') || '';
      const map = {
        'about': 'About',
        'cart': 'Bag',
        'checkout': 'Checkout',
        'contact': 'Contact',
        'error': 'Error Page',
        'faqs': 'FAQs',
        'account': 'My Account',
        'order-tracking': 'Order Tracking',
        'wishlist': 'Wishlist',
        'returns': 'Returns + Exchanges',
        'shipping': 'Shipping + Delivery',
        'find-us': 'Find Us',
        'services': 'Services',
        'single-item': 'Single Item',
      };
      const label = map[page] || 'Coming Soon';
      document.title = `${label} | INRL`;
      const titleEl = document.getElementById('title');
      const descEl = document.getElementById('desc');
      if (titleEl) titleEl.textContent = label;
      if (descEl) descEl.textContent = `${label} isn’t implemented yet.`;
    })();
  </script>
</body>
</html>
