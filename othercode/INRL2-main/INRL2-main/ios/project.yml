# InRL floor-placement test app (step: iPhone floor test). Generate the
# Xcode project with `xcodegen` in this folder; see ios/README.md.
name: FloorTest
options:
  bundleIdPrefix: co.wearenot.inrl2
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: RA4U4TWPVZ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FloorTest:
    type: application
    platform: iOS
    sources: [FloorTest]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.wearenot.inrl2.floortest
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: InRL Floor
        INFOPLIST_KEY_NSCameraUsageDescription: InRL uses the camera to place your scene in the room.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
        INFOPLIST_KEY_UIStatusBarHidden: YES
    info:
      path: FloorTest/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: co.wearenot.inrl2.floortest
            CFBundleURLSchemes: [inrlfloor]
        InRLStartURL: https://inrl2.marine-469.workers.dev/floor
